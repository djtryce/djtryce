version: "1.1-audited"
verified_at: "2026-09-07"
status: "scaffold"
methodology:
  confidence_levels:
    A: "Règle vérifiée sur source officielle primaire et automatisable"
    B: "Règle vérifiée mais calcul ou simulation externe nécessaire"
    H: "Règle vérifiée mais appréciation humaine ou administrative nécessaire"
    C: "Information insuffisamment sécurisée"
  principle: "Ne jamais conclure à une éligibilité définitive lorsqu'une appréciation administrative est requise."

