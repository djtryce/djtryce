notes:
  - "Ce fichier est volontairement incomplet : seules les règles déjà auditées ou des règles d'orientation prudentes sont présentes."
  - "Les dispositifs restant non sourcés au niveau requis restent hors moteur."
  - "Le FSL exige une couche locale départementale avant toute conclusion sur l'ouverture ou le montant."
  - "RSA, prime d'activité et ASPA sont orientés vers une simulation ou instruction officielle : le moteur ne calcule pas leur montant final."
