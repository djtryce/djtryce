name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check web app syntax
        env:
          PYTHONPATH: .
        run: python -m py_compile app.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          python -m pytest -q --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            pytest-output.txt
            pytest-report.xml
